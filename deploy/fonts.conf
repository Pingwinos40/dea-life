<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Tk plus colour-emoji fonts equals a hard crash.

  Tk uploads glyphs to the X server with RENDER/RenderAddGlyphs. Colour
  bitmap fonts (NotoColorEmoji, CBDT/CBLC) overflow that request and the
  server answers BadLength. That is an X PROTOCOL error, so Xlib aborts
  the process: the app dies the instant an emoji is drawn. Worst over
  forwarded X (bench report 2026-07-27, display :10.0, RHEL9).

  Rejecting only the COLOUR families lets fontconfig fall back to the
  monochrome "Noto Emoji" outline font, so the emoji in the UI still
  render, just not in colour. The system config is included first so font
  paths and every other rule stay exactly as they were.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Noto Color Emoji</string></patelt></pattern>
    </rejectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Twemoji</string></patelt></pattern>
    </rejectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Apple Color Emoji</string></patelt></pattern>
    </rejectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Segoe UI Emoji</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
